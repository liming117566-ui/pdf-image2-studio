services:
  pdf-image2:
    build: .
    container_name: pdf-image2
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      DATA_DIR: /data
      NODE_ENV: production
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:3220:3000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
